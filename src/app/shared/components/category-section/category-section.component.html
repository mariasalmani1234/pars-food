<section class="categories page-container" aria-label="دسته‌بندی غذاها">
  <div class="category-title"><h2>چی میل داری؟</h2><span>از طعم دلخواهت شروع کن</span></div>
  <div class="category-grid">
    @for(category of categories;track category.id){
      <a class="category-card" routerLink="/restaurants" [queryParams]="{category:category.id}">
        <span class="category-icon"><app-icon [name]="category.icon"/></span>
        <span><strong>{{category.name}}</strong><small>{{category.description}}</small></span>
        <span class="category-arrow"><app-icon name="arrow"/></span>
      </a>
    }
  </div>
</section>
