<article class="restaurant-card">


<div class="image-box">


<img

[src]="restaurant.image"

[alt]="restaurant.name"

>


<div class="rate">

⭐ {{restaurant.rate}}

</div>


</div>





<div class="content">


<span>
{{restaurant.city}}
</span>


<h3>

{{restaurant.name}}

</h3>



<p>

{{restaurant.description}}

</p>




<div class="footer">


<strong>

{{restaurant.isOpen ? 'باز است':'بسته'}}

</strong>



<a

[routerLink]="['/restaurant',restaurant.id]"

>

مشاهده

</a>



</div>



</div>


</article>
