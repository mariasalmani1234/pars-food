<a class="restaurant-card" [routerLink]="['/restaurants',restaurant.id]" [attr.aria-label]="'مشاهده منوی ' + restaurant.name">
  <div class="image-box"><img [appImage]="restaurant.image" [alt]="restaurant.name" loading="lazy" width="400" height="260">
    <span class="status" [class.closed]="!restaurant.isOpen"><i aria-hidden="true"></i>{{restaurant.isOpen?'اکنون باز است':'بسته است'}}</span>
  </div>
  <div class="content">
    <div class="name-row"><h3>{{restaurant.name}}</h3><span class="rate"><app-icon name="star"/>{{restaurant.rate.toLocaleString('fa-IR')}}</span></div>
    <p>{{restaurant.description}}</p>
    <div class="card-bottom"><span class="city"><app-icon name="pin"/>{{restaurant.city}}</span><span class="menu-link">مشاهده منو <app-icon name="arrow"/></span></div>
  </div>
</a>
