<section
class="profile-page"
*ngIf="user"
>


<header class="profile-header">


<div>


<span>

Pars Food

</span>


<h1>

پروفایل من

</h1>


<p>

مدیریت اطلاعات و سفارش‌های شما

</p>


</div>



<div class="avatar">

{{user.name.charAt(0)}}

</div>


</header>





<div class="profile-container">





<div class="info-card">


<h2>

اطلاعات حساب

</h2>



<div class="info-row">

<span>
نام
</span>


<strong>
{{user.name}}
</strong>

</div>



<div class="info-row">

<span>
ایمیل
</span>


<strong>
{{user.email}}
</strong>

</div>



<div class="info-row">

<span>
شماره تماس
</span>


<strong>
{{user.phone}}
</strong>

</div>


</div>







<div class="stats-grid">


<div class="stat-card">


<span>

سفارش‌ها

</span>


<strong>

{{orders.length}}

</strong>


</div>




<div class="stat-card">


<span>

مجموع خرید

</span>


<strong>


{{

totalPurchase
.toLocaleString('fa-IR')

}}

</strong>


<small>
تومان
</small>


</div>



</div>







<div class="profile-actions">


<a
routerLink="/orders"
>

مشاهده سفارش‌ها

</a>



<button
(click)="logout()"
>

خروج از حساب

</button>


</div>





</div>



</section>
